014579"]}, {"f6": 2, "f4": 2, "n": 3, "chords": ["06", "0137", "0146"]}, {"f6": 2, "f4": 2.646, "n": 2, "chords": ["0236", "0258"]}, {"f6": 2, "f4": 3, "n": 4, "chords": ["023568", "023469", "013569", "013479"]}, {"f6": 2, "f4": 3.464, "n": 1, "chords": ["023689"]}, {"f6": 3, "f4": 0, "n": 2, "chords": ["024", "048"]}, {"f6": 3, "f4": 1, "n": 5, "chords": ["01246", "01248", "01268", "01357", "01468"]}, {"f6": 3, "f4": 1.732, "n": 1, "chords": ["026"]}, {"f6": 3, "f4": 2, "n": 3, "chords": ["02346", "02458", "02469"]}, {"f6": 3, "f4": 2.646, "n": 1, "chords": ["02368"]}, {"f6": 4, "f4": 0, "n": 1, "chords": ["012468"]}, {"f6": 4, "f4": 1, "n": 2, "chords": ["0246", "0248"]}, {"f6": 4, "f4": 1.732, "n": 2, "chords": ["023468", "013579"]}, {"f6": 4, "f4": 2, "n": 1, "chords": ["0268"]}, {"f6": 5, "f4": 1, "n": 1, "chords": ["02468"]}, {"f6": 6, "f4": 0, "n": 1, "chords": ["02468t"]}];const path=[{"f6": 6, "f4": 0}, {"f6": 4, "f4": 1.732}, {"f6": 3, "f4": 2}, {"f6": 2, "f4": 3}, {"f6": 1, "f4": 3.606}, {"f6": 0, "f4": 4}];const svg=document.getElementById('plot'),tip=document.getElementById('tip'),NS='http://www.w3.org/2000/svg',W=760,H=500,m={l:62,r:30,t:24,b:58},pw=W-m.l-m.r,ph=H-m.t-m.b,x=v=>m.l+(v/6)*pw,y=v=>m.t+ph-(v/4)*ph;function E(n,a={}){const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}for(let i=0;i<=6;i++){svg.appendChild(E('line',{x1:x(i),y1:m.t,x2:x(i),y2:m.t+ph,class:'grid'}));let t=E('text',{x:x(i),y:H-30,'text-anchor':'middle',class:'tick'});t.textContent=i;svg.appendChild(t)}for(let i=0;i<=4;i++){svg.appendChild(E('line',{x1:m.l,y1:y(i),x2:m.l+pw,y2:y(i),class:'grid'}));let t=E('text',{x:36,y:y(i)+5,'text-anchor':'end',class:'tick'});t.textContent=i;svg.appendChild(t)}svg.appendChild(E('line',{x1:m.l,y1:m.t+ph,x2:m.l+pw,y2:m.t+ph,class:'axis'}));svg.appendChild(E('line',{x1:m.l,y1:m.t,x2:m.l,y2:m.t+ph,class:'axis'}));let t=E('text',{x:m.l+pw/2,y:H-7,'text-anchor':'middle',class:'label'});

t.textContent='Diminished-seventh-ness (Fourier component 4, magnitude)';svg.appendChild(t);const shade=n=>n<=1?'#e2ecf7':n<=2?'#bcd2ea':n<=3?'#8fb0d8':n<=6?'#6189c1':n<=10?'#3d63a3':'#22406f';

const LEGEND=[[1,'1'],[2,'2'],[3,'3'],[6,'4–6'],[10,'7–10'],[15,'11–15']],LEGEND_TITLE='Number of set classes:';
document.getElementById('legend').innerHTML=LEGEND_TITLE+' '+LEGEND.map(([n,lab])=>`<span><i style="background:${shade(n)}"></i>${lab}</span>`).join('');

/* ---- SVG download ---- */
const EXPORT_CSS='.grid{stroke:#ddd}.axis{stroke:#111;stroke-width:1.4}.tick,.label{fill:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px}.bubble{fill-opacity:.9;stroke:#2f4f78;stroke-width:1.2}.pathline{fill:none;stroke:#c13f3f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.pathpoint{fill:#c13f3f;stroke:#111;stroke-width:1}';
const PNG_SCALE=3,BAND=44,EH=H+BAND;
function exportSVGSource(){
  const c=svg.cloneNode(true);
  c.querySelectorAll('.pathlabel').forEach(e=>e.remove());
  c.removeAttribute('id');
  c.setAttribute('xmlns',NS);
  c.setAttribute('viewBox','0 0 '+W+' '+EH);
  c.setAttribute('width',W);
  c.setAttribute('height',EH);
  const st=document.createElementNS(NS,'style');
  st.textContent=EXPORT_CSS;
  c.insertBefore(st,c.firstChild);
  c.insertBefore(E('rect',{x:0,y:0,width:W,height:EH,fill:'#ffffff'}),st.nextSibling);
  const ty=H+22;
  let tt=E('text',{x:62,y:ty+5,class:'tick','text-anchor':'start'});
  tt.textContent=LEGEND_TITLE;
  c.appendChild(tt);
  let px=62+LEGEND_TITLE.length*7.2+12;
  LEGEND.forEach(([n,lab])=>{
    c.appendChild(E('circle',{cx:px+7,cy:ty,r:6,class:'bubble',style:'fill:'+shade(n)}));
    const lt=E('text',{x:px+19,y:ty+5,class:'tick','text-anchor':'start'});
    lt.textContent=lab;
    c.appendChild(lt);
    px+=29+lab.length*7.5+10;
  });
  return new XMLSerializer().serializeToString(c);
}
function save(url,name){
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
document.getElementById('dl').addEventListener('click',()=>{
  const src='<?xml version="1.0" encoding="UTF-8"?>\n'+exportSVGSource();
  const url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml;charset=utf-8'}));
  save(url,'f4-vs-f6-chord-space.svg');
  URL.revokeObjectURL(url);
});
document.getElementById('dlpng').addEventListener('click',()=>{
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');
    cv.width=W*PNG_SCALE;cv.height=EH*PNG_SCALE;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{
      const url=URL.createObjectURL(b);
      save(url,'f4-vs-f6-chord-space.png');
      URL.revokeObjectURL(url);
    },'image/png');
  };
  img.onerror=()=>alert('PNG export failed — the SVG could not be rasterized.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(exportSVGSource());
});</script></body></html>
